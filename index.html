<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuditFlow — Engagement Tracker Demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f2; color: #1a1a18; font-size: 14px; }
  .app { display: flex; height: 100vh; min-height: 600px; }
  .sidebar { width: 220px; min-width: 220px; background: #fff; border-right: 0.5px solid rgba(0,0,0,0.12); padding: 20px 0; display: flex; flex-direction: column; }
  .sidebar-logo { padding: 0 20px 20px; border-bottom: 0.5px solid rgba(0,0,0,0.12); }
  .logo-name { font-size: 15px; font-weight: 600; color: #1a1a18; }
  .logo-sub { font-size: 11px; color: #888; margin-top: 2px; }
  .nav-section { padding: 16px 12px 8px; font-size: 11px; font-weight: 600; color: #aaa; letter-spacing: 0.05em; text-transform: uppercase; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin: 0 8px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #666; transition: background 0.15s; }
  .nav-item:hover { background: #f0efea; }
  .nav-item.active { background: #f0efea; color: #1a1a18; font-weight: 500; }
  .nav-item i { font-size: 16px; }
  .sidebar-bottom { margin-top: auto; padding: 16px; border-top: 0.5px solid rgba(0,0,0,0.12); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0; }
  .user-chip-display { display: flex; align-items: center; gap: 8px; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { padding: 16px 24px; background: #fff; border-bottom: 0.5px solid rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 16px; font-weight: 500; }
  .btn { padding: 7px 14px; border-radius: 6px; border: 0.5px solid rgba(0,0,0,0.2); background: transparent; color: #1a1a18; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s; font-family: inherit; }
  .btn:hover { background: #f5f5f2; }
  .btn-primary { background: #1a1a18; color: #fff; border-color: transparent; }
  .btn-primary:hover { background: #333; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: #f0efea; border-radius: 8px; padding: 16px; }
  .stat-label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .stat-value { font-size: 22px; font-weight: 500; }
  .stat-sub { font-size: 11px; color: #888; margin-top: 4px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-title { font-size: 14px; font-weight: 500; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { padding: 5px 10px; border-radius: 20px; border: 0.5px solid rgba(0,0,0,0.2); background: transparent; font-size: 12px; cursor: pointer; color: #666; font-family: inherit; transition: all 0.15s; }
  .filter-btn.active { background: #1a1a18; color: #fff; border-color: transparent; }
  .project-table { background: #fff; border-radius: 10px; border: 0.5px solid rgba(0,0,0,0.12); overflow: hidden; }
  .table-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 80px; gap: 8px; padding: 10px 16px; background: #f9f9f7; border-bottom: 0.5px solid rgba(0,0,0,0.1); font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.04em; }
  .project-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr 80px; gap: 8px; padding: 12px 16px; border-bottom: 0.5px solid rgba(0,0,0,0.07); cursor: pointer; transition: background 0.1s; align-items: center; }
  .project-row:last-child { border-bottom: none; }
  .project-row:hover { background: #f9f9f7; }
  .project-name { font-size: 13px; font-weight: 500; }
  .project-meta { font-size: 11px; color: #888; margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge-on-track { background: #EAF3DE; color: #3B6D11; }
  .badge-overdue { background: #FCEBEB; color: #A32D2D; }
  .badge-approaching { background: #FAEEDA; color: #854F0B; }
  .badge-needs-approval { background: #E6F1FB; color: #185FA5; }
  .badge-completed { background: #E1F5EE; color: #0F6E56; }
  .badge-not-started { background: #F1EFE8; color: #5F5E5A; }
  .badge-paused { background: #FBEAF0; color: #993556; }
  .progress-wrap { background: rgba(0,0,0,0.08); border-radius: 4px; height: 5px; width: 100%; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; }
  .progress-pct { font-size: 11px; color: #888; margin-top: 3px; }
  .priority-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .priority-high { background: #E24B4A; }
  .priority-medium { background: #EF9F27; }
  .priority-low { background: #639922; }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; opacity: 0; transition: opacity 0.15s; }
  .project-row:hover .row-actions { opacity: 1; }
  .icon-btn { width: 26px; height: 26px; border-radius: 5px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #888; transition: background 0.15s; }
  .icon-btn:hover { background: #eee; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal { background: #fff; border-radius: 12px; width: 600px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal-header { padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 15px; font-weight: 500; }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 0 24px 20px; display: flex; gap: 8px; justify-content: flex-end; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 12px; font-weight: 500; color: #666; }
  input, select, textarea { border: 0.5px solid rgba(0,0,0,0.2); border-radius: 6px; padding: 8px 10px; font-size: 13px; background: #fff; color: #1a1a18; font-family: inherit; outline: none; transition: border-color 0.15s; width: 100%; }
  input:focus, select:focus, textarea:focus { border-color: rgba(0,0,0,0.4); }
  textarea { resize: vertical; min-height: 70px; }
  .user-select { display: flex; flex-wrap: wrap; gap: 6px; }
  .user-chip-sel { display: flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 20px; border: 0.5px solid rgba(0,0,0,0.2); cursor: pointer; font-size: 12px; transition: all 0.15s; }
  .user-chip-sel.selected { background: #1a1a18; color: #fff; border-color: transparent; }
  .alert-bar { padding: 8px 16px; font-size: 12px; display: flex; align-items: center; gap: 8px; border-radius: 6px; margin-bottom: 10px; }
  .alert-danger { background: #FCEBEB; color: #A32D2D; }
  .alert-warn { background: #FAEEDA; color: #854F0B; }
  .alert-info { background: #E6F1FB; color: #185FA5; }
  .empty { text-align: center; padding: 60px 20px; color: #888; }
  .empty i { font-size: 36px; display: block; margin-bottom: 12px; opacity: 0.4; }
  .avatar-stack { display: flex; }
  .avatar-stack .avatar { width: 22px; height: 22px; font-size: 9px; border: 2px solid #fff; margin-left: -6px; }
  .avatar-stack .avatar:first-child { margin-left: 0; }
  .main-and-detail { display: flex; flex: 1; overflow: hidden; }
  .detail-panel { background: #fff; border-left: 0.5px solid rgba(0,0,0,0.12); width: 380px; min-width: 380px; display: flex; flex-direction: column; overflow: hidden; }
  .detail-scroll { flex: 1; overflow-y: auto; padding: 20px; }
  .detail-panel h2 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .detail-section { margin-top: 18px; }
  .detail-section h3 { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
  .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 0.5px solid rgba(0,0,0,0.07); font-size: 13px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-key { color: #888; }
  .notes-log { display: flex; flex-direction: column; gap: 10px; }
  .note-entry { background: #f9f9f7; border-radius: 8px; padding: 10px 12px; border: 0.5px solid rgba(0,0,0,0.08); }
  .note-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; flex-wrap: wrap; }
  .note-author { font-size: 12px; font-weight: 500; }
  .note-time { font-size: 11px; color: #888; }
  .note-text { font-size: 13px; line-height: 1.5; color: #1a1a18; }
  .note-type-badge { font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 500; margin-left: auto; }
  .note-type-update { background: #E6F1FB; color: #185FA5; }
  .note-type-issue { background: #FCEBEB; color: #A32D2D; }
  .note-type-general { background: #F1EFE8; color: #5F5E5A; }
  .note-type-approval { background: #EAF3DE; color: #3B6D11; }
  .note-input-area { border-top: 0.5px solid rgba(0,0,0,0.1); padding: 14px 20px; background: #fff; }
  .note-input-area textarea { min-height: 60px; margin-bottom: 8px; }
  .note-controls { display: flex; align-items: center; gap: 8px; }
  .note-type-sel { width: auto; flex: 1; font-size: 12px; padding: 5px 8px; }
  .detail-tabs { display: flex; border-bottom: 0.5px solid rgba(0,0,0,0.12); }
  .detail-tab { padding: 10px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: #888; transition: all 0.15s; }
  .detail-tab.active { color: #1a1a18; border-bottom-color: #1a1a18; font-weight: 500; }
  .field-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 0.5px solid rgba(0,0,0,0.12); border-radius: 6px; margin-bottom: 8px; }
  .field-label-text { flex: 1; font-size: 13px; }
  .tag { padding: 2px 7px; background: #f0efea; border-radius: 4px; font-size: 11px; color: #666; }
  .user-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
  .user-card { background: #fff; border-radius: 10px; border: 0.5px solid rgba(0,0,0,0.12); padding: 14px; }
  @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2,1fr); } .detail-panel { display: none; } .sidebar { width: 180px; min-width: 180px; } }
  @media (max-width: 600px) { .sidebar { display: none; } .stats-grid { grid-template-columns: repeat(2,1fr); } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var USERS = [
  { id:'u1', name:'Elizabeth', initials:'EL', color:'#E6F1FB', textColor:'#0C447C' },
  { id:'u2', name:'Jacob',     initials:'JA', color:'#EAF3DE', textColor:'#3B6D11' },
  { id:'u3', name:'Zach',      initials:'ZA', color:'#FAEEDA', textColor:'#854F0B' },
  { id:'u4', name:'Sara',      initials:'SA', color:'#FBEAF0', textColor:'#993556' }
];
var CURRENT_USER = USERS[0];
var STATUS_CONFIG = {
  'on-track':       { label:'On track',      cls:'badge-on-track',       icon:'ti-circle-check' },
  'overdue':        { label:'Overdue',        cls:'badge-overdue',        icon:'ti-alert-circle'  },
  'approaching':    { label:'Due soon',       cls:'badge-approaching',    icon:'ti-clock'         },
  'needs-approval': { label:'Needs approval', cls:'badge-needs-approval', icon:'ti-thumb-up'      },
  'completed':      { label:'Completed',      cls:'badge-completed',      icon:'ti-check'         },
  'not-started':    { label:'Not started',    cls:'badge-not-started',    icon:'ti-minus'         },
  'paused':         { label:'Paused',         cls:'badge-paused',         icon:'ti-player-pause'  }
};
var NOTE_TYPES = ['General','Update','Issue','Approval'];
var SAMPLE_PROJECTS = [
  { id:'p1', name:'Audit TX', description:'Texas state compliance audit covering FY2025 filings and regulatory requirements.', status:'on-track', priority:'high', progress:60, dueDate:'2026-07-15', createdAt:'2026-04-01', ownerId:'u1', assignees:['u1','u2'], state:'TX', fiscalYear:'2025', engagementType:'Compliance', notes:[
    { id:'n1', authorId:'u1', text:'Kickoff call completed with client. PBC list sent — awaiting responses on items 3, 7, and 12.', type:'Update', timestamp:'2026-05-10T09:15:00' },
    { id:'n2', authorId:'u2', text:'Received partial PBC responses. Bank recs look clean. Still waiting on fixed asset schedule.', type:'Update', timestamp:'2026-05-20T14:30:00' },
    { id:'n3', authorId:'u1', text:'Client flagged a reconciling item on the intercompany account — need to follow up before fieldwork begins.', type:'Issue', timestamp:'2026-05-27T11:00:00' }
  ]},
  { id:'p2', name:'Audit NC', description:'North Carolina annual audit engagement for fiscal year 2025.', status:'needs-approval', priority:'high', progress:90, dueDate:'2026-06-01', createdAt:'2026-03-15', ownerId:'u2', assignees:['u2','u4'], state:'NC', fiscalYear:'2025', engagementType:'Annual Audit', notes:[
    { id:'n4', authorId:'u4', text:'Fieldwork complete. Draft financials prepared and sent to manager for review.', type:'Update', timestamp:'2026-05-18T10:00:00' },
    { id:'n5', authorId:'u2', text:'Manager review in progress. Minor adjustments needed on footnote disclosures — Sara to revise.', type:'Approval', timestamp:'2026-05-25T16:45:00' }
  ]},
  { id:'p3', name:'Audit TN', description:'Tennessee engagement — includes review of grant expenditures and federal compliance testing.', status:'overdue', priority:'high', progress:35, dueDate:'2026-05-15', createdAt:'2026-02-10', ownerId:'u3', assignees:['u3','u1'], state:'TN', fiscalYear:'2025', engagementType:'Federal Compliance', notes:[
    { id:'n6', authorId:'u3', text:'Client has been slow responding to document requests. Escalation email sent to their CFO today.', type:'Issue', timestamp:'2026-05-05T08:30:00' },
    { id:'n7', authorId:'u1', text:'CFO responded — documents expected by end of week. Adjusting timeline internally.', type:'Update', timestamp:'2026-05-12T13:00:00' },
    { id:'n8', authorId:'u3', text:'Still missing the grant expenditure detail. This is now pushing us past the original due date.', type:'Issue', timestamp:'2026-05-22T09:45:00' }
  ]},
  { id:'p4', name:'Audit CA', description:'California engagement — large client with multiple subsidiaries. Complex consolidation required.', status:'not-started', priority:'medium', progress:0, dueDate:'2026-08-30', createdAt:'2026-05-01', ownerId:'u4', assignees:['u1','u2','u3','u4'], state:'CA', fiscalYear:'2025', engagementType:'Consolidation Audit', notes:[
    { id:'n9', authorId:'u4', text:'Engagement letter signed. Planning meeting scheduled for June 10th with full team.', type:'General', timestamp:'2026-05-28T10:00:00' }
  ]}
];
var DEFAULT_FIELDS = [
  { id:'cf1', label:'State',           type:'text',   key:'state' },
  { id:'cf2', label:'Fiscal Year',     type:'text',   key:'fiscalYear' },
  { id:'cf3', label:'Engagement Type', type:'select', key:'engagementType', options:'Compliance,Annual Audit,Federal Compliance,Consolidation Audit,Review,Agreed-Upon Procedures' }
];
var ST = {
  view:'dashboard', filter:'all',
  projects: JSON.parse(localStorage.getItem('af2_projects') || 'null') || SAMPLE_PROJECTS,
  fields:   JSON.parse(localStorage.getItem('af2_fields')   || 'null') || DEFAULT_FIELDS,
  modal: null, editingProject: null, selectedProject: null, detailTab:'details', formData: {}
};
function persist() {
  localStorage.setItem('af2_projects', JSON.stringify(ST.projects));
  localStorage.setItem('af2_fields',   JSON.stringify(ST.fields));
}
function computeStatus(p) {
  if (['completed','not-started','paused','needs-approval'].indexOf(p.status) !== -1) return p.status;
  var diff = Math.ceil((new Date(p.dueDate) - new Date()) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff <= 7) return 'approaching';
  return 'on-track';
}
function getStats() {
  var ps = ST.projects;
  return {
    total: ps.length,
    overdue: ps.filter(function(p){return computeStatus(p)==='overdue';}).length,
    approaching: ps.filter(function(p){return computeStatus(p)==='approaching';}).length,
    needsApproval: ps.filter(function(p){return computeStatus(p)==='needs-approval';}).length,
    completed: ps.filter(function(p){return computeStatus(p)==='completed';}).length,
    avgProgress: ps.length ? Math.round(ps.reduce(function(a,p){return a+p.progress;},0)/ps.length) : 0
  };
}
function getUser(id) { return USERS.filter(function(u){return u.id===id;})[0]; }
function fmtDate(d) { if(!d) return '—'; return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtTime(ts) { var d=new Date(ts); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' at '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }

function mk(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function avEl(uid, size) {
  size = size || 28;
  var u = getUser(uid);
  var e = mk('div','avatar');
  e.style.cssText = 'width:'+size+'px;height:'+size+'px;font-size:'+Math.floor(size*0.38)+'px;background:'+(u?u.color:'#eee')+';color:'+(u?u.textColor:'#888');
  e.textContent = u ? u.initials : '?';
  return e;
}
function badgeEl(status) {
  var c = STATUS_CONFIG[status] || STATUS_CONFIG['not-started'];
  var b = mk('span','badge '+c.cls);
  var ic = mk('i', 'ti '+c.icon); ic.style.fontSize='10px';
  b.appendChild(ic);
  b.appendChild(document.createTextNode(' '+c.label));
  return b;
}
function pBar(pct, color) {
  var wrap = mk('div','progress-wrap');
  var fill = mk('div','progress-fill');
  fill.style.cssText = 'width:'+pct+'%;background:'+(color||'#1D9E75');
  wrap.appendChild(fill);
  return wrap;
}

function buildSidebar() {
  var items = [
    {icon:'ti-layout-dashboard',label:'Dashboard',view:'dashboard'},
    {icon:'ti-list',label:'All Audits',view:'projects'},
    {icon:'ti-user',label:'My Audits',view:'mine'},
    {icon:'ti-settings',label:'Field Settings',view:'fields'}
  ];
  var aside = mk('aside','sidebar');
  var logo = mk('div','sidebar-logo');
  logo.appendChild(mk('div','logo-name','AuditFlow'));
  logo.appendChild(mk('div','logo-sub','Engagement tracker — Demo'));
  aside.appendChild(logo);
  aside.appendChild(mk('div','nav-section','Navigation'));
  items.forEach(function(item) {
    var ni = mk('div','nav-item'+(ST.view===item.view?' active':''));
    var ic = mk('i','ti '+item.icon); ni.appendChild(ic);
    ni.appendChild(document.createTextNode(item.label));
    ni.onclick = (function(v){ return function(){ ST.view=v; ST.selectedProject=null; render(); }; })(item.view);
    aside.appendChild(ni);
  });
  var sb = mk('div','sidebar-bottom');
  var uc = mk('div','user-chip-display');
  var av = mk('div','avatar');
  av.style.cssText = 'background:'+CURRENT_USER.color+';color:'+CURRENT_USER.textColor+';width:28px;height:28px;font-size:11px';
  av.textContent = CURRENT_USER.initials;
  var ud = mk('div');
  ud.appendChild(mk('div',null,CURRENT_USER.name)); ud.firstChild.style.cssText='font-size:12px;font-weight:500';
  var ur = mk('div',null,'Lead Auditor'); ur.style.cssText='font-size:11px;color:#888';
  ud.appendChild(ur);
  uc.appendChild(av); uc.appendChild(ud); sb.appendChild(uc); aside.appendChild(sb);
  return aside;
}

function buildDashboard() {
  var s = getStats();
  var wrap = mk('div');
  if (s.overdue>0) { var a=mk('div','alert-bar alert-danger'); var ic=mk('i','ti ti-alert-circle'); a.appendChild(ic); a.appendChild(document.createTextNode(' '+s.overdue+' audit'+(s.overdue>1?'s are':' is')+' overdue — immediate follow-up required.')); wrap.appendChild(a); }
  if (s.approaching>0) { var a=mk('div','alert-bar alert-warn'); var ic=mk('i','ti ti-clock'); a.appendChild(ic); a.appendChild(document.createTextNode(' '+s.approaching+' audit'+(s.approaching>1?'s are':' is')+' due within 7 days.')); wrap.appendChild(a); }
  if (s.needsApproval>0) { var a=mk('div','alert-bar alert-info'); var ic=mk('i','ti ti-thumb-up'); a.appendChild(ic); a.appendChild(document.createTextNode(' '+s.needsApproval+' audit'+(s.needsApproval>1?'s need':' needs')+' manager approval.')); wrap.appendChild(a); }
  var sg = mk('div','stats-grid');
  function sc(lbl,val,sub,col) { var c=mk('div','stat-card'); var l=mk('div','stat-label',lbl); var v=mk('div','stat-value',String(val)); if(col)v.style.color=col; var s2=mk('div','stat-sub',sub); c.appendChild(l);c.appendChild(v);c.appendChild(s2); return c; }
  sg.appendChild(sc('Total engagements',s.total,s.completed+' completed',null));
  sg.appendChild(sc('Overdue',s.overdue,'need attention',s.overdue>0?'#A32D2D':null));
  sg.appendChild(sc('Due within 7 days',s.approaching,'approaching deadline',s.approaching>0?'#854F0B':null));
  sg.appendChild(sc('Avg. progress',s.avgProgress+'%','across all audits',null));
  wrap.appendChild(sg);
  var sh = mk('div','section-header'); sh.style.marginTop='24px';
  sh.appendChild(mk('div','section-title','All engagements'));
  var vb = mk('button','btn btn-sm','View all'); vb.onclick=function(){ST.view='projects';render();}; sh.appendChild(vb);
  wrap.appendChild(sh);
  wrap.appendChild(buildTable(ST.projects));
  wrap.appendChild(mk('div','section-title','Team overview')).style.cssText='margin-top:24px;margin-bottom:14px';
  var ug = mk('div','user-grid');
  USERS.forEach(function(u) {
    var ups = ST.projects.filter(function(p){return p.assignees.indexOf(u.id)!==-1;});
    if (!ups.length) return;
    var card = mk('div','user-card');
    var hd = mk('div'); hd.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:12px';
    var av = mk('div','avatar'); av.style.cssText='background:'+u.color+';color:'+u.textColor+';width:28px;height:28px;font-size:11px'; av.textContent=u.initials;
    var ud = mk('div');
    var un = mk('div',null,u.name); un.style.cssText='font-size:13px;font-weight:500';
    var uc2 = mk('div',null,ups.length+' engagement'+(ups.length>1?'s':'')); uc2.style.cssText='font-size:11px;color:#888';
    ud.appendChild(un); ud.appendChild(uc2); hd.appendChild(av); hd.appendChild(ud); card.appendChild(hd);
    ups.forEach(function(p) {
      var row = mk('div'); row.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:6px';
      var nm = mk('span',null,p.name); nm.style.fontSize='12px';
      row.appendChild(nm); row.appendChild(badgeEl(computeStatus(p))); card.appendChild(row);
    });
    ug.appendChild(card);
  });
  wrap.appendChild(ug);
  return wrap;
}

function buildTable(projects) {
  if (!projects.length) { var e=mk('div','empty'); var ic=mk('i','ti ti-folder-off'); e.appendChild(ic); e.appendChild(document.createTextNode('No engagements found')); return e; }
  var table = mk('div','project-table');
  var hdr = mk('div','table-header');
  ['Engagement','Status','Priority','Progress','Due date',''].forEach(function(t){hdr.appendChild(mk('div',null,t));});
  table.appendChild(hdr);
  projects.forEach(function(p) {
    var cs = computeStatus(p);
    var owner = getUser(p.ownerId);
    var nc = (p.notes||[]).length;
    var row = mk('div','project-row');
    row.onclick = (function(pid){ return function(){ ST.selectedProject=pid; ST.detailTab='details'; render(); }; })(p.id);
    var nameCell = mk('div');
    var nm = mk('div','project-name',p.name);
    var meta = mk('div','project-meta',(owner?owner.name:'')+' · '+(p.state||''));
    if (nc>0) { var nspan=mk('span',null,'💬 '+nc); nspan.style.cssText='margin-left:6px;font-size:10px;color:#888'; meta.appendChild(nspan); }
    nameCell.appendChild(nm); nameCell.appendChild(meta);
    var priCell = mk('div'); priCell.style.cssText='display:flex;align-items:center;font-size:12px;color:#888';
    var dot = mk('span','priority-dot priority-'+p.priority);
    priCell.appendChild(dot); priCell.appendChild(document.createTextNode(p.priority.charAt(0).toUpperCase()+p.priority.slice(1)));
    var progCell = mk('div');
    var barColor = cs==='overdue'?'#E24B4A':cs==='approaching'?'#EF9F27':'#1D9E75';
    var pct = mk('div','progress-pct',p.progress+'%');
    progCell.appendChild(pBar(p.progress,barColor)); progCell.appendChild(pct);
    var dueColor = cs==='overdue'?'#A32D2D':cs==='approaching'?'#854F0B':'#888';
    var dueCell = mk('div',null,fmtDate(p.dueDate)); dueCell.style.cssText='font-size:12px;color:'+dueColor;
    var actions = mk('div','row-actions');
    var editBtn = mk('button','icon-btn'); editBtn.title='Edit';
    editBtn.appendChild(mk('i','ti ti-edit')); editBtn.firstChild.style.fontSize='14px';
    editBtn.onclick = (function(proj){ return function(ev){ ev.stopPropagation(); openEdit(proj); }; })(p);
    var delBtn = mk('button','icon-btn'); delBtn.title='Delete';
    var delIc = mk('i','ti ti-trash'); delIc.style.cssText='font-size:14px;color:#A32D2D'; delBtn.appendChild(delIc);
    delBtn.onclick = (function(proj){ return function(ev){
      ev.stopPropagation();
      if(confirm('Delete this engagement?')){ ST.projects=ST.projects.filter(function(x){return x.id!==proj.id;}); if(ST.selectedProject===proj.id)ST.selectedProject=null; persist();render(); }
    }; })(p);
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    row.appendChild(nameCell); row.appendChild(badgeEl(cs)); row.appendChild(priCell); row.appendChild(progCell); row.appendChild(dueCell); row.appendChild(actions);
    table.appendChild(row);
  });
  return table;
}

function buildDetail(pid) {
  var p = ST.projects.filter(function(x){return x.id===pid;})[0];
  if (!p) return null;
  var cs = computeStatus(p);
  var owner = getUser(p.ownerId);
  var panel = mk('div','detail-panel');
  var tabs = mk('div','detail-tabs');
  var td = mk('div','detail-tab'+(ST.detailTab==='details'?' active':''),'Details');
  td.onclick = function(){ ST.detailTab='details'; render(); };
  var nc = (p.notes||[]).length;
  var tn = mk('div','detail-tab'+(ST.detailTab==='notes'?' active':''),'Notes'+(nc>0?' ('+nc+')':''));
  tn.onclick = function(){ ST.detailTab='notes'; render(); };
  tabs.appendChild(td); tabs.appendChild(tn); panel.appendChild(tabs);

  if (ST.detailTab==='details') {
    var scroll = mk('div','detail-scroll');
    var hdrRow = mk('div'); hdrRow.style.cssText='display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px';
    var hdrL = mk('div'); hdrL.appendChild(mk('h2',null,p.name)); hdrL.appendChild(badgeEl(cs));
    var closeBtn = mk('button','icon-btn'); closeBtn.appendChild(mk('i','ti ti-x'));
    closeBtn.onclick = function(){ ST.selectedProject=null; render(); };
    hdrRow.appendChild(hdrL); hdrRow.appendChild(closeBtn); scroll.appendChild(hdrRow);
    if (p.description) { var desc=mk('p',null,p.description); desc.style.cssText='font-size:13px;color:#888;line-height:1.6;margin-bottom:14px'; scroll.appendChild(desc); }
    var pw = mk('div'); pw.style.marginBottom='14px';
    var ph = mk('div'); ph.style.cssText='display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px';
    var pl = mk('span',null,'Progress'); pl.style.color='#888';
    var pv = mk('span',null,p.progress+'%'); pv.style.fontWeight='500';
    ph.appendChild(pl); ph.appendChild(pv); pw.appendChild(ph);
    pw.appendChild(pBar(p.progress,cs==='overdue'?'#E24B4A':cs==='approaching'?'#EF9F27':'#1D9E75'));
    scroll.appendChild(pw);
    var ds = mk('div','detail-section'); ds.appendChild(mk('h3',null,'Details'));
    function dRow(key, valEl) { var r=mk('div','detail-row'); var k=mk('span','detail-key',key); r.appendChild(k); r.appendChild(valEl); return r; }
    var ow = mk('div'); ow.style.cssText='display:flex;align-items:center;gap:6px'; ow.appendChild(avEl(p.ownerId,20)); var on=mk('span',null,owner?owner.name:'—'); on.style.fontSize='13px'; ow.appendChild(on);
    ds.appendChild(dRow('Owner',ow));
    var stack = mk('div','avatar-stack'); (p.assignees||[]).forEach(function(uid){stack.appendChild(avEl(uid,22));}); ds.appendChild(dRow('Team',stack));
    var pw2 = mk('div'); pw2.style.cssText='display:flex;align-items:center;gap:5px;font-size:13px'; pw2.appendChild(mk('span','priority-dot priority-'+p.priority)); pw2.appendChild(document.createTextNode(p.priority)); ds.appendChild(dRow('Priority',pw2));
    var dc = mk('span',null,fmtDate(p.dueDate)); dc.style.cssText='font-size:13px;color:'+(cs==='overdue'?'#A32D2D':cs==='approaching'?'#854F0B':'inherit'); ds.appendChild(dRow('Due date',dc));
    var cc = mk('span',null,fmtDate(p.createdAt)); cc.style.fontSize='13px'; ds.appendChild(dRow('Created',cc));
    scroll.appendChild(ds);
    if (ST.fields.length) {
      var cfs = mk('div','detail-section'); cfs.appendChild(mk('h3',null,'Engagement fields'));
      ST.fields.forEach(function(f){ var v=p[f.key]; if(f.type==='checkbox')v=v?'Yes':'No'; if(!v&&v!==0)v='—'; cfs.appendChild(dRow(f.label,mk('span',null,String(v)))); });
      scroll.appendChild(cfs);
    }
    var aw = mk('div'); aw.style.cssText='margin-top:16px;display:flex;gap:8px';
    var eb = mk('button','btn btn-primary btn-sm'); eb.style.flex='1'; eb.appendChild(mk('i','ti ti-edit')); eb.appendChild(document.createTextNode(' Edit'));
    eb.onclick = (function(proj){ return function(){ openEdit(proj); }; })(p);
    aw.appendChild(eb);
    if (p.status!=='needs-approval') {
      var sb2 = mk('button','btn btn-sm'); sb2.style.flex='1'; sb2.appendChild(mk('i','ti ti-thumb-up')); sb2.appendChild(document.createTextNode(' Submit for approval'));
      sb2.onclick=(function(proj){return function(){proj.status='needs-approval';persist();render();};})(p); aw.appendChild(sb2);
    } else {
      var ab = mk('button','btn btn-sm'); ab.style.cssText='flex:1;background:#EAF3DE;color:#3B6D11;border-color:#C0DD97'; ab.appendChild(mk('i','ti ti-check')); ab.appendChild(document.createTextNode(' Approve & complete'));
      ab.onclick=(function(proj){return function(){proj.status='completed';proj.progress=100;persist();render();};})(p); aw.appendChild(ab);
    }
    scroll.appendChild(aw); panel.appendChild(scroll);
  } else {
    var nw = mk('div'); nw.style.cssText='flex:1;overflow-y:auto;padding:16px';
    var sorted = (p.notes||[]).slice().sort(function(a,b){return new Date(a.timestamp)-new Date(b.timestamp);});
    if (sorted.length) {
      var log = mk('div','notes-log');
      sorted.forEach(function(n) {
        var u = getUser(n.authorId);
        var entry = mk('div','note-entry');
        var meta = mk('div','note-meta');
        if(u) meta.appendChild(avEl(n.authorId,20));
        meta.appendChild(mk('span','note-author',u?u.name:'Unknown'));
        meta.appendChild(mk('span','note-time',fmtTime(n.timestamp)));
        meta.appendChild(mk('span','note-type-badge note-type-'+(n.type||'general').toLowerCase(),n.type||'General'));
        var txt = mk('p','note-text',n.text);
        entry.appendChild(meta); entry.appendChild(txt); log.appendChild(entry);
      });
      nw.appendChild(log);
    } else {
      var emp = mk('div',null,'No notes yet. Add the first one below.'); emp.style.cssText='text-align:center;padding:30px;color:#888;font-size:13px'; nw.appendChild(emp);
    }
    panel.appendChild(nw);
    var ia = mk('div','note-input-area');
    var ta = document.createElement('textarea'); ta.placeholder='Add a note, update, or flag an issue...'; ia.appendChild(ta);
    var ctrl = mk('div','note-controls');
    var ts = document.createElement('select'); ts.className='note-type-sel';
    NOTE_TYPES.forEach(function(t){ var o=document.createElement('option');o.value=t;o.textContent=t;ts.appendChild(o); });
    var addBtn = mk('button','btn btn-primary btn-sm'); addBtn.appendChild(mk('i','ti ti-send')); addBtn.appendChild(document.createTextNode(' Add note'));
    addBtn.onclick = (function(proj,textarea,typesel){ return function(){
      var txt=textarea.value.trim(); if(!txt)return;
      if(!proj.notes)proj.notes=[];
      proj.notes.push({id:'n'+Date.now(),authorId:CURRENT_USER.id,text:txt,type:typesel.value,timestamp:new Date().toISOString()});
      persist();render();
    }; })(p,ta,ts);
    ctrl.appendChild(ts); ctrl.appendChild(addBtn); ia.appendChild(ctrl); panel.appendChild(ia);
  }
  return panel;
}

function buildProjectsView(mine) {
  var ps = mine ? ST.projects.filter(function(p){return p.ownerId===CURRENT_USER.id||p.assignees.indexOf(CURRENT_USER.id)!==-1;}) : ST.projects;
  var fm = {overdue:'overdue',approaching:'approaching','needs-approval':'needs-approval',completed:'completed'};
  if (ST.filter!=='all'&&fm[ST.filter]) ps=ps.filter(function(p){return computeStatus(p)===fm[ST.filter];});
  var wrap = mk('div');
  var sh = mk('div','section-header');
  sh.appendChild(mk('div','section-title',mine?'My Audits':'All Engagements ('+ps.length+')'));
  var filters = mk('div','filters');
  ['all','overdue','approaching','needs-approval','completed'].forEach(function(f){
    var btn=mk('button','filter-btn'+(ST.filter===f?' active':''),f==='all'?'All':(STATUS_CONFIG[f]?STATUS_CONFIG[f].label:f));
    btn.onclick=(function(fv){return function(){ST.filter=fv;render();};})(f); filters.appendChild(btn);
  });
  sh.appendChild(filters); wrap.appendChild(sh); wrap.appendChild(buildTable(ps)); return wrap;
}

function buildFields() {
  var icons={text:'ti-text-size',number:'ti-123',date:'ti-calendar',select:'ti-list',checkbox:'ti-checkbox'};
  var wrap=mk('div'); var sh=mk('div','section-header'); sh.appendChild(mk('div','section-title','Custom Fields')); wrap.appendChild(sh);
  var box=mk('div'); box.style.cssText='background:#fff;border-radius:10px;border:0.5px solid rgba(0,0,0,0.12);padding:16px';
  var info=mk('div',null,'Fields captured for every engagement. Add or remove as your workflow evolves.'); info.style.cssText='font-size:12px;color:#888;margin-bottom:12px'; box.appendChild(info);
  ST.fields.forEach(function(f){
    var row=mk('div','field-item');
    row.appendChild(mk('i','ti '+(icons[f.type]||'ti-variable'))); row.firstChild.style.cssText='font-size:16px;color:#888';
    row.appendChild(mk('span','field-label-text',f.label)); row.appendChild(mk('span','tag',f.type));
    var db=mk('button','icon-btn'); db.appendChild(mk('i','ti ti-trash')).style.cssText='font-size:14px;color:#A32D2D';
    db.onclick=(function(fid){return function(){ST.fields=ST.fields.filter(function(x){return x.id!==fid;});persist();render();};})(f.id);
    row.appendChild(db); box.appendChild(row);
  });
  var aa=mk('div'); aa.style.cssText='border-top:0.5px solid rgba(0,0,0,0.1);padding-top:14px;margin-top:4px';
  aa.appendChild(mk('div',null,'Add new field')).style.cssText='font-size:13px;font-weight:500;margin-bottom:10px';
  var ar=mk('div'); ar.style.cssText='display:flex;gap:8px;align-items:flex-end';
  var lg=mk('div','form-group'); lg.style.flex='1'; lg.appendChild(mk('label',null,'Field name'));
  var li=document.createElement('input'); li.type='text'; li.placeholder='Field name'; lg.appendChild(li);
  var tg=mk('div','form-group'); tg.appendChild(mk('label',null,'Type'));
  var ts=document.createElement('select');
  ['text','number','date','select','checkbox'].forEach(function(t){var o=document.createElement('option');o.value=t;o.textContent=t.charAt(0).toUpperCase()+t.slice(1);ts.appendChild(o);});
  tg.appendChild(ts);
  var ab=mk('button','btn btn-primary'); ab.appendChild(mk('i','ti ti-plus')); ab.appendChild(document.createTextNode(' Add'));
  ab.onclick=function(){if(!li.value.trim())return;ST.fields.push({id:'cf'+Date.now(),label:li.value.trim(),type:ts.value,key:li.value.trim().replace(/\s+/g,'_').toLowerCase()});persist();render();};
  ar.appendChild(lg);ar.appendChild(tg);ar.appendChild(ab);aa.appendChild(ar);box.appendChild(aa);wrap.appendChild(box);return wrap;
}

function openEdit(p) {
  ST.editingProject = p || null;
  ST.formData = p ? JSON.parse(JSON.stringify(p)) : {name:'',description:'',status:'not-started',priority:'medium',progress:0,dueDate:'',ownerId:CURRENT_USER.id,assignees:[CURRENT_USER.id],state:'',fiscalYear:'',engagementType:'',notes:[]};
  ST.modal='project'; render();
}

function buildModal() {
  var isEdit = !!ST.editingProject;
  var fd = ST.formData;
  var overlay = mk('div','modal-bg');
  overlay.onclick = function(e){ if(e.target===overlay){ST.modal=null;render();} };
  var modal = mk('div','modal');
  var mh = mk('div','modal-header');
  mh.appendChild(mk('div','modal-title',isEdit?'Edit engagement':'New engagement'));
  var cb=mk('button','icon-btn'); cb.appendChild(mk('i','ti ti-x')); cb.onclick=function(){ST.modal=null;render();}; mh.appendChild(cb);
  modal.appendChild(mh);
  var mb=mk('div','modal-body'); var grid=mk('div','form-grid');
  function fg(lbl,inp,full){ var g=mk('div','form-group'+(full?' full':'')); var l=mk('label',null,lbl); g.appendChild(l); g.appendChild(inp); return g; }
  var ni=document.createElement('input'); ni.type='text'; ni.value=fd.name||''; ni.placeholder='e.g. Audit TX'; ni.oninput=function(){fd.name=this.value;};
  var di=document.createElement('textarea'); di.placeholder='Engagement description...'; di.value=fd.description||''; di.oninput=function(){fd.description=this.value;};
  var ss=document.createElement('select');
  Object.keys(STATUS_CONFIG).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=STATUS_CONFIG[k].label;if(k===fd.status)o.selected=true;ss.appendChild(o);});
  ss.onchange=function(){fd.status=this.value;};
  var ps=document.createElement('select');
  ['high','medium','low'].forEach(function(p){var o=document.createElement('option');o.value=p;o.textContent=p.charAt(0).toUpperCase()+p.slice(1);if(p===fd.priority)o.selected=true;ps.appendChild(o);});
  ps.onchange=function(){fd.priority=this.value;};
  var pi=document.createElement('input'); pi.type='number'; pi.min='0'; pi.max='100'; pi.value=String(fd.progress||0); pi.oninput=function(){fd.progress=Math.min(100,Math.max(0,Number(this.value)));};
  var dui=document.createElement('input'); dui.type='date'; dui.value=fd.dueDate||''; dui.oninput=function(){fd.dueDate=this.value;};
  var cw=mk('div','user-select');
  USERS.forEach(function(u){
    var sel=(fd.assignees||[]).indexOf(u.id)!==-1;
    var chip=mk('div','user-chip-sel'+(sel?' selected':''));
    var av=mk('div','avatar'); av.style.cssText='width:18px;height:18px;font-size:8px;background:'+u.color+';color:'+u.textColor; av.textContent=u.initials;
    chip.appendChild(av); chip.appendChild(document.createTextNode(u.name));
    chip.onclick=(function(uid,ch){return function(){
      var a=fd.assignees||[]; var idx=a.indexOf(uid);
      if(idx!==-1)fd.assignees=a.filter(function(x){return x!==uid;});
      else fd.assignees=a.concat([uid]);
      ch.className='user-chip-sel'+(fd.assignees.indexOf(uid)!==-1?' selected':'');
    };})(u.id,chip);
    cw.appendChild(chip);
  });
  grid.appendChild(fg('Engagement name *',ni,true));
  grid.appendChild(fg('Description',di,true));
  grid.appendChild(fg('Status',ss,false));
  grid.appendChild(fg('Priority',ps,false));
  grid.appendChild(fg('Progress (%)',pi,false));
  grid.appendChild(fg('Due date',dui,false));
  grid.appendChild(fg('Team members',cw,true));
  ST.fields.forEach(function(f){
    var inp;
    if(f.type==='checkbox'){inp=document.createElement('input');inp.type='checkbox';inp.style.width='auto';if(fd[f.key])inp.checked=true;inp.onchange=function(){fd[f.key]=this.checked;};}
    else if(f.type==='select'&&f.options){
      inp=document.createElement('select');
      var blank=document.createElement('option');blank.value='';blank.textContent='Select...';inp.appendChild(blank);
      f.options.split(',').forEach(function(opt){var o=document.createElement('option');o.value=opt.trim();o.textContent=opt.trim();if(opt.trim()===fd[f.key])o.selected=true;inp.appendChild(o);});
      inp.onchange=function(){fd[f.key]=this.value;};
    } else {
      inp=document.createElement('input'); inp.type=f.type==='number'?'number':f.type==='date'?'date':'text'; inp.value=String(fd[f.key]||'');
      inp.oninput=function(){fd[f.key]=f.type==='number'?Number(this.value):this.value;};
    }
    grid.appendChild(fg(f.label,inp,false));
  });
  mb.appendChild(grid); modal.appendChild(mb);
  var mf=mk('div','modal-footer');
  var cancelBtn=mk('button','btn','Cancel'); cancelBtn.onclick=function(){ST.modal=null;render();}; mf.appendChild(cancelBtn);
  var saveBtn=mk('button','btn btn-primary',isEdit?'Save changes':'Create engagement');
  saveBtn.onclick=function(){
    if(!fd.name||!fd.name.trim()){alert('Please enter an engagement name.');return;}
    if(isEdit){
      var idx=ST.projects.findIndex(function(x){return x.id===ST.editingProject.id;});
      if(idx!==-1){var orig=ST.projects[idx]; ST.projects[idx]=Object.assign({},orig,fd,{notes:orig.notes||[]});}
    } else {
      ST.projects.unshift(Object.assign({},fd,{id:'p'+Date.now(),createdAt:new Date().toISOString().split('T')[0],notes:[]}));
    }
    ST.modal=null; persist(); render();
  };
  mf.appendChild(saveBtn); modal.appendChild(mf); overlay.appendChild(modal); return overlay;
}

function render() {
  var app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(buildSidebar());
  var main = mk('div','main');
  var titles = {dashboard:'Dashboard',projects:'All Engagements',mine:'My Audits',fields:'Field Settings'};
  var topbar = mk('div','topbar');
  topbar.appendChild(mk('h1',null,titles[ST.view]||''));
  if (ST.view!=='fields') {
    var nb=mk('button','btn btn-primary'); nb.appendChild(mk('i','ti ti-plus')); nb.appendChild(document.createTextNode(' New engagement'));
    nb.onclick=function(){openEdit(null);}; topbar.appendChild(nb);
  } else { topbar.appendChild(mk('span')); }
  var content;
  if(ST.view==='dashboard')     content=buildDashboard();
  else if(ST.view==='projects') content=buildProjectsView(false);
  else if(ST.view==='mine')     content=buildProjectsView(true);
  else                          content=buildFields();
  var cw=mk('div','content'); cw.appendChild(content);
  var mi=mk('div','main-and-detail'); mi.appendChild(cw);
  if(ST.selectedProject){ var dp=buildDetail(ST.selectedProject); if(dp)mi.appendChild(dp); }
  main.appendChild(topbar); main.appendChild(mi); app.appendChild(main);
  if(ST.modal) app.appendChild(buildModal());
}
render();
</script>
</body>
